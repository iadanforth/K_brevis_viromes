# ---------------------------------------------------------------------------------------
# pipeline.conf - every site- and user-specific setting in one file.
#
# EDIT THIS FIRST. run_pipeline.sh reads it and nothing else needs changing for another
# account on the same cluster. Values are shell assignments; this file is sourced.
#
# Run `bash scripts/setup_new_user.sh` after editing: it rewrites the absolute paths that
# are baked into #SBATCH directives, which cannot expand ~ or $HOME and so cannot read
# this file.
# ---------------------------------------------------------------------------------------

# --- who and where ---------------------------------------------------------------------
PROJECT_ROOT="$HOME/K_brevis_viromes"      # the clone of this repository
SCRATCH="$HOME/scr10/data/kbrevis"         # all job input/output; big, never backed up
ARCHIVE="$HOME/data10"                     # databases and anything to keep long term
NODE_TMP="/local/scr/$USER"                # node-local temp used inside jobs
MAIL_USER="$(whoami)@wm.edu"               # SciClone rejects non-wm.edu/vims.edu addresses
MAIL_TYPE="FAIL,END"

# --- how to reach conda and Slurm --------------------------------------------------------
# On SciClone each cluster has its own Slurm configuration module and they conflict, so
# every submission runs in a subshell that loads exactly one. On a site with a single
# Slurm, set SLURM_MODULE_FOR to return an empty string and the loads become no-ops.
CONDA_MODULE="miniforge3"

# Which cluster each stage is submitted to, and with what. These are the values that
# worked on the dates in the README's step sections, not permanent advice: check
# `~/hpc/best_cluster.sh -c CORES -m MEM_GB -H HOURS` before a long run and edit here.
#
# Format: CLUSTER:SBATCH ARGS
STAGE_OPTS_00_envs="astral:-p batch --exclude=as01"
STAGE_OPTS_01_download="bora:-p batch"
STAGE_OPTS_02_fastp="bora:-p batch"
STAGE_OPTS_03_refs="bora:-p batch"
STAGE_OPTS_04_clean="bora:-p hima -C hi --exclude=hi04,hi05,hi07"
STAGE_OPTS_05a_assembly="kuro:-p serial"
STAGE_OPTS_05b_assembly="kuro:-p serial"
STAGE_OPTS_06_merge="kuro:-p serial"
STAGE_OPTS_07_setup="astral:-p batch -c 4 --exclude=as01 --mem=16G -t 6:00:00"
STAGE_OPTS_08_gvmags="kuro:-p serial"
STAGE_OPTS_09_votus="kuro:-p serial -c 16 --mem=64G -t 4:00:00"
# step 10 asks for 128 GB in its #SBATCH; the measured peak is 3.6 GB
STAGE_OPTS_10_phylogeny="kuro:-p serial -c 32 --mem=16G -t 4:00:00"
# step 11 asks for 3 days, which exceeds kuro's 48 h cap; measured peak 42.5 GB of 96 GB
STAGE_OPTS_11_tree="kuro:-p serial -c 64 --mem=96G -t 48:00:00"
STAGE_OPTS_12_collect="kuro:-p serial"
STAGE_OPTS_13_itol="astral:-p batch --exclude=as01 -c 2 --mem=8G -t 30:00"
STAGE_OPTS_14_abundance="bora:-p hima -C hi --exclude=hi04,hi05,hi07"
STAGE_OPTS_15_ani="astral:-p batch --exclude=as01"
# small helper jobs (metadata copy, reference prep, merges, plotting)
STAGE_OPTS_helper="astral:-p batch --exclude=as01 -c 2 --mem=8G -t 1:00:00"

# --- analysis parameters that the scripts take on the command line ------------------------
# Changing these changes the science. The README explains each one.
VOTU_MIN_ANI=95            # MIUViG species boundary, also used in step 09
VOTU_MIN_AF=85             # over this fraction of the shorter genome
IQTREE_MSET="LG,WAG,JTT"   # restricting ModelFinder; unrestricted would burn the walltime
IQTREE_CMAX=4
ABUNDANCE_MIN_BREADTH=0.75 # genome breadth required to call a vOTU present

# The 9 incubation-experiment runs (CH1 May 2021, CH2 Aug 2021). Everything else in
# metadata/SraRunTable.csv is an environmental sample. Step 14 maps the ENVIRONMENTAL
# samples' reads against the GVMAGs recovered from these incubations, which is the
# comparison the whole analysis turns on, so the split is defined here in one place.
INCUBATION_SAMPLES="SRR28004137,SRR28004138,SRR28004139,SRR28004140,SRR28004141,SRR28004142,SRR28004143,SRR28004144,SRR28004154"

# --- optional behaviour ------------------------------------------------------------------
# Set to 1 to skip steps 03/03b (the ~79 GB reference download). Safe only if
# $SCRATCH/reference already holds the six FASTAs and the bowtie2 index.
SKIP_REFERENCE_DOWNLOAD=0
